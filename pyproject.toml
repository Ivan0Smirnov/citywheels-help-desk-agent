[project]
name = "citywheels-help-desk-agent"
version = "0.1.0"
description = "Command-line help desk agent for the CityWheels bike rental shop"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["citywheels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
